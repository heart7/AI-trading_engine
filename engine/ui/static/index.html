<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCHFE Engine</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="tip" role="tooltip"></div>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>UCHFE</h1><span class="lbl" id="clock">paper session</span></div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <button class="btn" type="button" id="whyBtn" aria-controls="why" aria-expanded="false">Why not trading?</button>
    <button class="btn" type="button" id="themeBtn" aria-label="Switch theme">◐ Theme</button>
  </div>
</header>
<aside class="drawer" id="why" hidden aria-label="Why not trading"></aside>
<div class="shell">
  <nav class="side" aria-label="Screens" id="nav"></nav>
  <main class="screen" id="screen" tabindex="-1"></main>
</div>
<section class="reporter closed" id="reporter" aria-label="Reporter">
  <header id="repHead"><h3>Reporter <span class="lbl">INFORM only · cites claims</span></h3><span aria-hidden="true">▴</span></header>
  <div class="body">
    <label class="lbl" for="repQ">Ask about the engine</label>
    <textarea id="repQ" placeholder="Why no ETH entry?"></textarea>
    <div class="ctrl-row" style="margin-top:6px"><button class="btn" type="button" id="repAsk">Ask</button>
      <span class="note">Answers are REPORTED class and cannot be exported as evidence.</span></div>
    <div id="repOut"></div>
  </div>
</section>
<script src="/app.js"></script>
<script src="/activity.js"></script>
</body>
</html>
