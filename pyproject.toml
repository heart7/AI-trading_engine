[project]
name = "uchfe"
version = "0.1.0"
description = "Unified Crypto Hedge Fund Engine (spec v10.4)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.7",
  "jsonschema>=4.21",
  "PyYAML>=6.0",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.5", "sshsig>=0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"tools/**" = ["S603", "S607"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "research*"]
