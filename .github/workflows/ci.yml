name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Secret scan
        run: python tools/secret_scan.py
      - name: Lint
        run: ruff check .
      - name: Policy loads and is coherent for PAPER
        run: python tools/uchfe.py coherence --mode PAPER
      - name: Reproducibility spot-check (replay twice vs golden hash)
        run: python tools/repro_check.py
      - name: Adapter conformance suite (simulated venue)
        run: python tools/uchfe.py conformance --connector kraken-spot --out runs/ci/conformance
      - name: P3.5 drills (kill verifier -> entries block; attribution to the penny)
        run: python tools/uchfe.py drill --out runs/ci/drills
      - name: P6 shadow drill (FIXTURE cycles; journal chain, recon, no H1/D1; FIXTURE never counts toward G2)
        run: python tools/shadow.py drill --out runs/ci/shadow
      - name: P8 learning drill (FIXTURE episodes; store chain, attribution exact, FIXTURE never fitted)
        run: python tools/learn.py drill --out runs/ci/learning
      - name: Stress battery on the active policy (reported; S4 fails, see decision 0004)
        run: python tools/uchfe.py stress --report-only --out runs/ci/stress
      - name: Tests and negative-test suite (with run record)
        env:
          UCHFE_INVARIANT_REPORT: runs/ci/invariants.json
        run: python tools/run_record.py --out runs/ci/tests.json --summary-json runs/ci/invariants.json -- python -m pytest -q tests
      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-records
          path: runs/ci/
